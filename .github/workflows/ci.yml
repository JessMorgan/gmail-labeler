name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.13"]
    env:
      # uv fetches its own standalone CPython per UV_PYTHON; the interpreter
      # step below asserts it matches the matrix cell.
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: uv.lock freshness
        run: uv lock --check

      - name: Sync dependencies (locked only)
        run: uv sync --group dev --locked

      - name: Assert interpreter matches matrix
        run: |
          uv run --frozen python - <<'EOF'
          import sys
          want = "${{ matrix.python-version }}"
          got = "%d.%d" % sys.version_info[:2]
          assert got == want, f"interpreter {got} != matrix {want}"
          print(f"interpreter {got} OK")
          EOF

      - name: Ruff check
        run: uv run --frozen ruff check .

      - name: Ruff format check
        run: uv run --frozen ruff format --check .

      - name: Pyright
        run: uv run --frozen pyright

      - name: Tests (coverage gate + live exclusion from pyproject addopts)
        run: uv run --frozen pytest -m "not live"

      - name: uv.lock untouched by the gates
        run: git diff --exit-code uv.lock
