# gmail-labeler configuration — copy to config.toml and edit.
# Every value shown is the DEFAULT; delete sections you don't need.
# Secrets are paths only — never tokens, never inline values.
# Relative paths resolve against THIS FILE's directory (not the cwd); ~ is
# expanded — gmail.credentials_path, gmail.token_file, corpus.dir, gyb.path.

[gmail]
# OAuth client JSON you downloaded from YOUR Google Cloud project
# (ADR-0004; the README setup section walks you through creating it).
# Default: none — set it before `auth` can run.
# credentials_path = "~/secrets/gmail-oauth-client.json"
token_backend = "keyring"          # "keyring" (OS vault) or "file"
# Used with token_backend = "file"; must be mode 0600:
token_file = "~/.config/gmail-labeler/token.json"
history_poll_seconds = 30          # daemon polling cadence (ADR-0003)

[labels]
# Tier Labels attached to every Application (GLOSSARY.md):
applied = "ai-applied"             # umbrella: "the AI contributed something"
high = "ai-high"                   # high-confidence band
med = "ai-med"                     # review-me band
# Managed Labels this install may apply — empty until you graduate labels
# from `dataset analyze` + `eval`, e.g.:
# managed = ["Shipping", "Money/Bills"]
managed = []

[corpus]
# Training/eval corpus directory — TREAT AS SECRET (it is your mail).
dir = "./corpus"

[gyb]
# Optional: path to an existing Got Your Back backup (contains
# msg-db.sqlite) for `dataset import-gyb`.
# path = "/mnt/backup/gmail"

[bands]
# Per-label Threshold Band calibration (ticket #21): the min-precision
# targets a candidate column's measured precision must meet to earn the
# band (tenths only — the tenth-grid stance). `eval --bands` writes the
# calibrated bands artifact; a per-label override is a subtable:
# [bands."Money/Bills"]
# min_high_precision = 0.9
# min_med_precision = 0.8
min_high_precision = 0.9
min_med_precision = 0.7

[model]
# Encoder identifier — the Checkpoint Sidecar's encoder_id field.
encoder = "deberta-v3-base"
# LOCAL path to the encoder weights (a pre-downloaded HF-style dir).
# Training downloads nothing — point this at weights you already have.
# Required for `train`; optional until then.
# encoder_path = "~/models/deberta-v3-base"
# Where `train` writes the checkpoint dir (gitignored; the JSON sidecar
# lands inside it). An existing checkpoint refuses a new run until you
# pass --force (retraining is human-gated, ADR-0005).
checkpoint_dir = "./checkpoints/latest"
