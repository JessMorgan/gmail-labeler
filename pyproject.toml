[project]
name = "gmail-labeler"
version = "0.0.1"
description = "Strictly-local Gmail auto-labeling: fine-tune a multi-label classifier on your own inbox history"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
authors = [{ name = "Jess Morgan" }]
keywords = ["gmail", "email", "classification", "auto-labeling", "local-first"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email",
]

dependencies = [
    "google-api-python-client>=2.201",
    "google-auth-oauthlib>=1.5",
    "keyring>=25.7",
    "pydantic>=2.14",
    "rich>=15",
    "typer>=0.27",
    "httplib2>=0.22",
]

[project.optional-dependencies]
# The real encoder (ticket #19, ADR-0001): only the train/ recipe
# imports these. CI and the importable core stay torch-free — the
# opt-in smoke/gpu markers are excluded from every CI/local-ci run.
train = [
    "torch>=2.6",
    # v5 line: the recipe uses v5's problem_type literal
    # ("multi_label_classification") and loss_is_scaled_for_ga
    "transformers>=5.22",
    # Trainer HARD-requires accelerate (a clean install without it
    # crashes the recipe on ImportError — verified on torch 2.15 /
    # transformers 5.22.1)
    "accelerate>=1.1.0",
]

[project.urls]
Repository = "https://github.com/JessMorgan/gmail-labeler"
Issues = "https://github.com/JessMorgan/gmail-labeler/issues"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest-cov>=7.1",
    "pytest>=9.2",
    "ruff>=0.17",
]

[project.scripts]
gmail-labeler = "gmail_labeler.cli:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gmail_labeler", "train"]

[tool.hatch.build.targets.sdist]
exclude = ["/.agents", "/.github"]

[tool.ruff]
src = ["src", "tests", "train"]
target-version = "py312"
extend-exclude = [".agents"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The gate and the opt-in-test exclusions (invariant #9) live here so a
# bare `uv run pytest` cannot bypass any of them; coverage scope/level
# come from [tool.coverage.*] below (single source of truth). Targeted
# local runs may pass --no-cov; -m live / -m smoke / -m gpu override
# the exclusions on purpose.
addopts = "-q --cov -m 'not live and not smoke and not gpu'"
markers = [
    "live: tests that hit the real Gmail API (never run in CI; opt-in with -m live)",
    "smoke: real-encoder CPU smoke — needs the optional `train` extra (torch); opt-in with -m smoke, excluded from CI",
    "gpu: real-encoder GPU run — needs the optional `train` extra plus CUDA; opt-in with -m gpu, excluded from CI",
]

[tool.coverage.run]
source = ["src/gmail_labeler"]

[tool.coverage.report]
fail_under = 80

[tool.pyright]
include = ["src", "tests", "train"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
# The pure core is held to strict (CODING-STANDARDS); list grows as modules land.
strict = [
    "src/gmail_labeler/labels.py",
    "src/gmail_labeler/corpus_record.py",
    "src/gmail_labeler/mime_extract.py",
    "src/gmail_labeler/analyze.py",
    "src/gmail_labeler/dataset_build.py",
    "src/gmail_labeler/model.py",
    "src/gmail_labeler/eval.py",
]
